# Copy this example to alexa/deploy.local.conf (gitignored) and fill in YOUR AWS deployment identifiers.
# Never put AWS credentials, bearer tokens or Cloudflare secrets in this file.
DEPLOY_PROFILE=bindicator
DEPLOY_REGION=eu-west-2
DEPLOY_ACCOUNT_ID=123456789012
DEPLOY_S3_BUCKET=example-private-lambda-deployments
DEPLOY_LAMBDA_FUNCTION=bindicator-alexa
# Optional: needed only with --deploy --update-skill-metadata.
# Use the skill ID of YOUR existing Amazon developer skill; never create a new skill.
DEPLOY_ALEXA_SKILL_ID=YOUR_EXISTING_SKILL_ID
# ASK CLI uses separate Amazon developer authentication from the AWS profile.
DEPLOY_ASK_PROFILE=default
