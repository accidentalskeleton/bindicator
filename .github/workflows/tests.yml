name: Tests

on:
  # Automatic Actions disabled while CI minutes/credits are exhausted.
  # Re-enable push and pull_request triggers when the billing limit resets.
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: Install Alexa Lambda SDK
        run: python -m pip install -r alexa/requirements.txt
      - name: Verify Alexa Lambda imports and skill ID guard
        env:
          ALEXA_SKILL_ID: amzn1.ask.skill.00000000-0000-0000-0000-000000000001
        run: python -c 'from alexa.lambda_function import lambda_handler; assert callable(lambda_handler)'
      - name: Check installer and Alexa packaging syntax
        run: bash -n deploy/install.sh deploy/setup-lan-web.sh alexa/build.sh
      - name: Compile
        run: python -m compileall -q src alexa
